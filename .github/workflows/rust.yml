name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            packages: "--workspace"
            features: ""
          - name: build (Annan)
            packages: "--workspace"
            features: "--features annan"
          - name: build (Anhoku)
            packages: "--workspace"
            features: "--features anhoku"
          - name: build (Anhoku NNUE 256)
            packages: "-p haitaka_wasm"
            features: "--features anhoku,nnue-l1-256"

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build ${{ matrix.packages }} ${{ matrix.features }} --verbose
    - name: Run tests
      run: cargo test ${{ matrix.packages }} ${{ matrix.features }} --verbose

    - name: Run orthogonal rule tests
      run: |
        cargo check --workspace --features annan,oute,sanmaime,igyoku --verbose
        cargo test -p haitaka --features annan,oute,sanmaime,igyoku oute_is_an_immediate_win_and_stops_play
        cargo test -p haitaka_wasm --features annan,oute,sanmaime,igyoku immediate_win_is_scored_as_terminal_loss_for_side_to_move
        cargo test -p haitaka_learn --features annan,oute,sanmaime,igyoku composite_rule_profile_has_stable_canonical_name
    - name: Check replay-filter donor composition
      run: cargo check --workspace --features neko,hitomasuou --verbose
    - name: Reject invalid feature categories
      shell: bash
      run: |
        if cargo check -p haitaka --features donor-category; then exit 1; fi
        if cargo check -p haitaka --features igyoku,hitomasuou; then exit 1; fi
        if cargo check -p haitaka --features annan,anhoku; then exit 1; fi

  python:
    name: Python R5 regressions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install CPU test dependency
      run: python -m pip install numpy==2.2.6
    - name: Run R5 regression tests
      run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/tests -v

  browser-worker:
    name: Browser worker regressions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Run browser worker regression tests
      run: node --test scripts/tests/*-browser-worker.test.mjs
