name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            packages: "--workspace"
            features: ""
          - name: build (Annan)
            packages: "--workspace"
            features: "--features annan"
          - name: build (Anhoku)
            packages: "--workspace"
            features: "--features anhoku"
          - name: build (Anhoku NNUE 256)
            packages: "-p haitaka_wasm"
            features: "--features anhoku,nnue-l1-256"

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build ${{ matrix.packages }} ${{ matrix.features }} --verbose
    - name: Run tests
      run: cargo test ${{ matrix.packages }} ${{ matrix.features }} --verbose
