name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            features: ""
          - name: build (Annan)
            features: "--features annan"
          - name: build (Anhoku)
            features: "--features anhoku"

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --workspace ${{ matrix.features }} --verbose
    - name: Run tests
      run: cargo test --workspace ${{ matrix.features }} --verbose
