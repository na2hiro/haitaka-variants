[package]
name = "haitaka"
version = "0.3.2"
edition = "2024"
authors = ["tofutofu <tofutofu@users.noreply.github.com>"]
readme = "README.md"

license = "MIT"
description = "Rust Shogi move generation library"
homepage = "https://github.com/tofutofu/haitaka"
repository = "https://github.com/tofutofu/haitaka"
keywords = ["shogi", "chess", "no_std"]
categories = ["games", "no-std"]

[dependencies]
haitaka-types = { path = "../haitaka_types", version = "0.1.3" }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[build-dependencies]
haitaka-types = { path = "../haitaka_types", version = "0.1.3" }

[dev-dependencies]
criterion = { version = "0.3.5", features = ["html_reports"] }
rand = "0.9"

[[bench]]
name = "legals"
harness = false

[[bench]]
name = "slider_moves"
harness = false

[[bench]]
name = "perft"
harness = false

[[bench]]
name = "dfpn"
harness = false

[features]
std = ["haitaka-types/std"]
qugiy = ["haitaka-types/qugiy"]
donor-category = []
win-condition-category = []
king-constraint-category = []
annan = ["donor-category", "haitaka-types/annan"]
anhoku = ["donor-category", "haitaka-types/anhoku"]
antouzai = ["donor-category", "haitaka-types/antouzai"]
taimen = ["donor-category", "haitaka-types/taimen"]
haimen = ["donor-category", "haitaka-types/haimen"]
neko = ["donor-category", "haitaka-types/neko"]
nekoneko = ["donor-category", "haitaka-types/nekoneko"]
yokoneko = ["donor-category", "haitaka-types/yokoneko"]
yokonekoneko = ["donor-category", "haitaka-types/yokonekoneko"]
tenkyo = ["donor-category", "haitaka-types/tenkyo"]
tenjiku = ["donor-category", "haitaka-types/tenjiku"]
anki = ["donor-category", "haitaka-types/anki"]
oute = ["win-condition-category"]
sanmaime = ["win-condition-category"]
inochinotokin = ["win-condition-category"]
igyoku = ["king-constraint-category"]
hitomasuou = ["king-constraint-category"]
