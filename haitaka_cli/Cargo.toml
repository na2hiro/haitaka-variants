[package]
name = "haitaka_cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
haitaka = { path = "../haitaka", default-features = false }
haitaka_wasm = { path = "../haitaka_wasm" }
libc = "0.2"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[features]
donor-category = ["haitaka/donor-category", "haitaka_wasm/donor-category"]
win-condition-category = ["haitaka/win-condition-category", "haitaka_wasm/win-condition-category"]
king-constraint-category = ["haitaka/king-constraint-category", "haitaka_wasm/king-constraint-category"]
annan = ["donor-category", "haitaka/annan", "haitaka_wasm/annan"]
anhoku = ["donor-category", "haitaka/anhoku", "haitaka_wasm/anhoku"]
antouzai = ["donor-category", "haitaka/antouzai", "haitaka_wasm/antouzai"]
taimen = ["donor-category", "haitaka/taimen", "haitaka_wasm/taimen"]
haimen = ["donor-category", "haitaka/haimen", "haitaka_wasm/haimen"]
neko = ["donor-category", "haitaka/neko", "haitaka_wasm/neko"]
nekoneko = ["donor-category", "haitaka/nekoneko", "haitaka_wasm/nekoneko"]
yokoneko = ["donor-category", "haitaka/yokoneko", "haitaka_wasm/yokoneko"]
yokonekoneko = ["donor-category", "haitaka/yokonekoneko", "haitaka_wasm/yokonekoneko"]
tenkyo = ["donor-category", "haitaka/tenkyo", "haitaka_wasm/tenkyo"]
tenjiku = ["donor-category", "haitaka/tenjiku", "haitaka_wasm/tenjiku"]
anki = ["donor-category", "haitaka/anki", "haitaka_wasm/anki"]
oute = ["win-condition-category", "haitaka/oute", "haitaka_wasm/oute"]
sanmaime = ["win-condition-category", "haitaka/sanmaime", "haitaka_wasm/sanmaime"]
inochinotokin = ["win-condition-category", "haitaka/inochinotokin", "haitaka_wasm/inochinotokin"]
shihonkangen = ["win-condition-category", "haitaka/shihonkangen", "haitaka_wasm/shihonkangen"]
ningenshogi = ["win-condition-category", "haitaka/ningenshogi", "haitaka_wasm/ningenshogi"]
igyoku = ["king-constraint-category", "haitaka/igyoku", "haitaka_wasm/igyoku"]
hitomasuou = ["king-constraint-category", "haitaka/hitomasuou", "haitaka_wasm/hitomasuou"]
