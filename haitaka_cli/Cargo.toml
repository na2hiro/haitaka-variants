[package]
name = "haitaka_cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
haitaka = { path = "../haitaka", default-features = false }
haitaka_wasm = { path = "../haitaka_wasm" }
libc = "0.2"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[features]
annan = ["haitaka/annan", "haitaka_wasm/annan"]
anhoku = ["haitaka/anhoku", "haitaka_wasm/anhoku"]
antouzai = ["haitaka/antouzai", "haitaka_wasm/antouzai"]
taimen = ["haitaka/taimen", "haitaka_wasm/taimen"]
haimen = ["haitaka/haimen", "haitaka_wasm/haimen"]
neko = ["haitaka/neko", "haitaka_wasm/neko"]
nekoneko = ["haitaka/nekoneko", "haitaka_wasm/nekoneko"]
yokoneko = ["haitaka/yokoneko", "haitaka_wasm/yokoneko"]
yokonekoneko = ["haitaka/yokonekoneko", "haitaka_wasm/yokonekoneko"]
tenkyo = ["haitaka/tenkyo", "haitaka_wasm/tenkyo"]
tenjiku = ["haitaka/tenjiku", "haitaka_wasm/tenjiku"]
anki = ["haitaka/anki", "haitaka_wasm/anki"]

small-board = ["variant-board", "compact-board", "scalar64", "haitaka/small-board", "haitaka_wasm/small-board"]
minishogi = ["small-board", "haitaka/minishogi", "haitaka_wasm/minishogi"]
judkins = ["small-board", "haitaka/judkins", "haitaka_wasm/judkins"]
gorogoro = ["small-board", "haitaka/gorogoro", "haitaka_wasm/gorogoro"]
gorogoro-plus = ["small-board", "haitaka/gorogoro-plus", "haitaka_wasm/gorogoro-plus"]
minishogi-kingin = ["small-board", "haitaka/minishogi-kingin", "haitaka_wasm/minishogi-kingin"]

variant-board = ["haitaka/variant-board", "haitaka_wasm/variant-board"]
compact-board = ["haitaka/compact-board", "haitaka_wasm/compact-board"]
scalar64 = ["haitaka/scalar64", "haitaka_wasm/scalar64"]
heian = ["variant-board", "haitaka/heian", "haitaka_wasm/heian"]
heian-8x8 = ["compact-board", "scalar64", "heian", "haitaka/heian-8x8", "haitaka_wasm/heian-8x8"]
heian-9x8 = ["compact-board", "heian", "haitaka/heian-9x8", "haitaka_wasm/heian-9x8"]
heian-9x9 = ["heian", "haitaka/heian-9x9", "haitaka_wasm/heian-9x9"]

extended-json = ["haitaka/extended-rules", "haitaka_wasm/extended-json"]
shoshogi = ["extended-json", "haitaka/shoshogi", "haitaka_wasm/shoshogi"]
chushogi = ["extended-json", "haitaka/chushogi", "haitaka_wasm/chushogi"]

torishogi = ["extended-json", "haitaka/torishogi", "haitaka_wasm/torishogi"]

washogi = ["extended-json", "haitaka/washogi", "haitaka_wasm/washogi"]

heian-dai = ["extended-json", "haitaka/heian-dai", "haitaka_wasm/heian-dai"]

daishogi = ["extended-json", "haitaka/daishogi", "haitaka_wasm/daishogi"]

tenjiku-dai = ["extended-json", "haitaka/tenjiku-dai", "haitaka_wasm/tenjiku-dai"]

dai-dai = ["extended-json", "haitaka/dai-dai", "haitaka_wasm/dai-dai"]

maka-dai-dai = ["extended-json", "haitaka/maka-dai-dai", "haitaka_wasm/maka-dai-dai"]

taishogi = ["extended-json", "haitaka/taishogi", "haitaka_wasm/taishogi"]
