[rules]
ruleset = "anhoku"

[paths]
output_dir = "out/anhoku-strength-first/step9-model-b-source-20260911-v1"

[data]
# Oversample independent source games so the frozen corpus can exclude every
# model-A board family, deduplicate internally, and still retain exactly
# 880,000 training records plus 60,000 validation records.
train_games = 36000
validation_games = 2400
max_plies = 180
label_search_nodes = 10000
label_search_max_depth = 64
position_policy = "root-position"
incomplete_label_policy = "reject-position"
label_retry_policy = "root-position-adaptive-retry-v1"
max_label_attempts_per_game = 96

# Keep the model-A handcrafted teacher and a bounded explored trajectory. The
# new game, split, and shuffle seeds make the raw source games independent.
rollout_search_depth = 1
self_play_move_policy = "searched-stochastic-rollout-v1"
rollout_candidate_limit = 16
rollout_score_margin = 80
rollout_temperature = 40.0
rollout_rng_version = "splitmix64-v1"
opening_random_plies = 0

opening_policy = "suite"
opening_suite = "haitaka_learn/openings/anhoku-v3.tsv"
opening_suite_id = "anhoku-v3"
validation_opening_ids = ["anhoku-v3-053", "anhoku-v3-054", "anhoku-v3-055", "anhoku-v3-056", "anhoku-v3-057", "anhoku-v3-058", "anhoku-v3-059", "anhoku-v3-060", "anhoku-v3-061", "anhoku-v3-062", "anhoku-v3-063", "anhoku-v3-064"]
validation_opening_schedule = "equal-color-swapped-pairs-v1"
validation_opening_pairs_per_id = 100
split_policy = "opening-group-hash-v1"
split_seed = 2026091105
shuffle_policy = "chunk-v1"
shuffle_seed = 2026091106
shuffle_chunk_records = 65536

sample_start_ply = 8
sample_every_ply = 2
sampling_policy = "per-game-random-v1"
max_positions_per_game = 64
minimum_train_boards = 920000
seed = 2026091104
jobs = 0
shard_games = 10
progress_every_percent = 5
resume = true

[training]
features = "HalfKAv2^+DonorSingleEff"
teacher_move_consumers = false

[verify]
run_search_smoke = false
