[rules]
ruleset = "anhoku"

[paths]
output_dir = "out/anhoku-v0.5.1"
trainer_checkout = "../haitaka-variant-nnue-pytorch"
python = "python3"
cmake = "cmake"

[data]
train_games = 50000
validation_games = 5000
max_plies = 180
search_depth = 3
rollout_search_depth = 1
opening_random_plies = 16
opening_policy = "uniform-random"
sample_start_ply = 8
sample_every_ply = 2
sampling_policy = "fixed-phase-legacy"
max_positions_per_game = 64
seed = 74
jobs = 0
shard_games = 20
progress_every_percent = 1
resume = true

[training]
features = "HalfKAv2^+DonorSingleEff"
num_workers = 8
batch_size = 16384
lambda = 0.8
random_fen_skipping = 3
epoch_size = 1000000
validation_size = 100000
max_epochs = 60
build_data_loader = true
extra_args = ["--threads", "8", "--accelerator", "gpu", "--devices", "1"]

[export]
output_name = "haitaka-anhoku-v0.5.1.reselected.nnue"
description = "Haitaka Anhoku v0.5.1 NNUE trained with HalfKAv2^+DonorSingleEff"

[verify]
search_depth = 2
run_search_smoke = true

[selection]
strategy = "anchored-ranking"
screen_games = 256
round_games = 128
max_total_games = 32768
max_games_per_candidate = 4096
explore_factor = 1.5
top_k = 3
movetime_ms = 100
storage_saver = true
