[rules]
ruleset = "anhoku"

[paths]
output_dir = "out/anhoku-v0.6-phase8c-root-1m"
bootstrap_nnue = "out/anhoku-v0.6-phase7.1-preserved/lane-c-step-16.nnue"

[data]
# 16,600 games x 64 attempted roots leaves a 1% rejection allowance while
# still exceeding the required 1,048,576 accepted root records.
train_games = 16600
validation_games = 384
max_plies = 180
label_search_nodes = 50000
label_search_max_depth = 64
position_policy = "root-position"
incomplete_label_policy = "reject-position"
rollout_search_depth = 1
self_play_move_policy = "uniform-rollout-v1"
opening_random_plies = 0
opening_policy = "suite"
opening_suite = "haitaka_learn/openings/anhoku-v2.tsv"
opening_suite_id = "anhoku-v2"
validation_opening_ids = ["anhoku-v2-053", "anhoku-v2-054", "anhoku-v2-055", "anhoku-v2-056", "anhoku-v2-057", "anhoku-v2-058", "anhoku-v2-059", "anhoku-v2-060", "anhoku-v2-061", "anhoku-v2-062", "anhoku-v2-063", "anhoku-v2-064"]
validation_opening_schedule = "equal-color-swapped-pairs-v1"
validation_opening_pairs_per_id = 16
split_policy = "opening-group-hash-v1"
split_seed = 76
shuffle_policy = "chunk-v1"
shuffle_seed = 77
shuffle_chunk_records = 65536
sample_start_ply = 8
sample_every_ply = 2
sampling_policy = "per-game-random-v1"
max_positions_per_game = 64
max_candidate_roots_per_game = 64
minimum_train_positions = 1048576
seed = 75
jobs = 0
shard_games = 10
progress_every_percent = 5
resume = true

[training]
resume = false
features = "HalfKAv2^+DonorSingleEff"
num_workers = 8
batch_size = 16384
lambda = 0.8
initial_learning_rate = 0.00015
random_fen_skipping = 3
epoch_size = 1048576
validation_size = 100000
checkpoint_interval_steps = 16
validation_interval_steps = 16
max_steps = 64
max_epochs = 60
build_data_loader = true
teacher_move_consumers = false
extra_args = ["--seed", "80", "--threads", "8", "--accelerator", "gpu", "--devices", "1"]

[verify]
run_search_smoke = false
