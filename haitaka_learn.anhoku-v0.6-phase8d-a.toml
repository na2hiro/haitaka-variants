[rules]
ruleset = "anhoku"

[paths]
output_dir = "out/anhoku-v0.6-phase8d-a"
bootstrap_nnue = "out/anhoku-v0.6-phase7.1-preserved/lane-c-step-16.nnue"

[data]
# 52 train IDs and 12 OOD-v2 IDs. Both Phase 8D-A commands explicitly visit
# one base/swapped pair per ID; ordinary data generation keeps its own schedule.
train_games = 104
validation_games = 24
max_plies = 180
label_search_nodes = 50000
label_search_max_depth = 64
position_policy = "root-position"
incomplete_label_policy = "reject-position"

# Phase 8D-A's sole production rollout policy.  The two tunable values are
# frozen only after trajectory-audit telemetry; this file records the initial
# bounded pilot contract and is not a training configuration.
rollout_search_depth = 1
self_play_move_policy = "searched-stochastic-rollout-v1"
rollout_candidate_limit = 16
rollout_score_margin = 80
rollout_temperature = 40.0
rollout_rng_version = "splitmix64-v1"
opening_random_plies = 0

opening_policy = "suite"
opening_suite = "haitaka_learn/openings/anhoku-v2.tsv"
opening_suite_id = "anhoku-v2"
validation_opening_ids = ["anhoku-v2-053", "anhoku-v2-054", "anhoku-v2-055", "anhoku-v2-056", "anhoku-v2-057", "anhoku-v2-058", "anhoku-v2-059", "anhoku-v2-060", "anhoku-v2-061", "anhoku-v2-062", "anhoku-v2-063", "anhoku-v2-064"]
validation_opening_schedule = "equal-color-swapped-pairs-v1"
validation_opening_pairs_per_id = 1
split_policy = "opening-group-hash-v1"
split_seed = 76

sample_start_ply = 8
sample_every_ply = 2
sampling_policy = "per-game-random-v1"
max_positions_per_game = 64
# One root per game keeps the three-budget calibration bounded.  Phase 8D-B
# may raise this after the launch gate, without changing the rollout policy.
max_candidate_roots_per_game = 1
seed = 75
jobs = 0
shard_games = 8
progress_every_percent = 10
resume = false

[training]
features = "HalfKAv2^+DonorSingleEff"
teacher_move_consumers = false

[verify]
run_search_smoke = false
