[rules]
ruleset = "anhoku"

[paths]
output_dir = "out/anhoku-v0.6-smoke"

[data]
train_games = 4
validation_games = 4
max_plies = 60
search_depth = 3
rollout_search_depth = 1
opening_random_plies = 0
opening_policy = "suite"
opening_suite = "haitaka_learn/openings/anhoku-v1.tsv"
opening_suite_id = "anhoku-v1"
split_policy = "opening-group-hash-v1"
split_seed = 76
shuffle_policy = "chunk-v1"
shuffle_seed = 77
shuffle_chunk_records = 16
sample_start_ply = 8
sample_every_ply = 2
sampling_policy = "per-game-random-v1"
max_positions_per_game = 24
seed = 75
jobs = 4
shard_games = 2
progress_every_percent = 25
resume = false

[training]
features = "HalfKAv2^+DonorSingleEff"
teacher_move_consumers = false

[verify]
run_search_smoke = false
