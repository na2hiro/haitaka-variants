[package]
name = "haitaka_wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haitaka = { path = "../haitaka", default-features = false }
wasm-bindgen = "0.2.100"
js-sys = "0.3.90"
instant = { version = "0.1", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1"
sha2 = "0.10"
criterion = { version = "0.3.5", features = ["html_reports"] }
rand = "0.9"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.68"

[[bench]]
name = "nnue"
harness = false

[features]
# Test-only static/delta trace export; omit from production packages.
sfnn-diagnostics = []
# Verification oracle: disable SFNN's detected/compiled optimized kernels.
sfnn-force-scalar = []
nnue-l1-256 = []
donor-category = ["haitaka/donor-category"]
win-condition-category = ["haitaka/win-condition-category"]
king-constraint-category = ["haitaka/king-constraint-category"]
annan = ["donor-category", "haitaka/annan"]
anhoku = ["donor-category", "haitaka/anhoku"]
antouzai = ["donor-category", "haitaka/antouzai"]
taimen = ["donor-category", "haitaka/taimen"]
haimen = ["donor-category", "haitaka/haimen"]
neko = ["donor-category", "haitaka/neko"]
nekoneko = ["donor-category", "haitaka/nekoneko"]
yokoneko = ["donor-category", "haitaka/yokoneko"]
yokonekoneko = ["donor-category", "haitaka/yokonekoneko"]
tenkyo = ["donor-category", "haitaka/tenkyo"]
tenjiku = ["donor-category", "haitaka/tenjiku"]
anki = ["donor-category", "haitaka/anki"]
oute = ["win-condition-category", "haitaka/oute"]
sanmaime = ["win-condition-category", "haitaka/sanmaime"]
inochinotokin = ["win-condition-category", "haitaka/inochinotokin"]
shihonkangen = ["win-condition-category", "haitaka/shihonkangen"]
ningenshogi = ["win-condition-category", "haitaka/ningenshogi"]
tennouzan = ["win-condition-category", "haitaka/tennouzan"]
igyoku = ["king-constraint-category", "haitaka/igyoku"]
hitomasuou = ["king-constraint-category", "haitaka/hitomasuou"]

small-board = ["variant-board", "compact-board", "scalar64", "haitaka/small-board"]
minishogi = ["small-board", "haitaka/minishogi"]
judkins = ["small-board", "haitaka/judkins"]
gorogoro = ["small-board", "haitaka/gorogoro"]
gorogoro-plus = ["small-board", "haitaka/gorogoro-plus"]
minishogi-kingin = ["small-board", "haitaka/minishogi-kingin"]

variant-board = ["haitaka/variant-board"]
compact-board = ["haitaka/compact-board"]
scalar64 = ["haitaka/scalar64"]
heian = ["variant-board", "haitaka/heian"]
heian-8x8 = ["compact-board", "scalar64", "heian", "haitaka/heian-8x8"]
heian-9x8 = ["compact-board", "heian", "haitaka/heian-9x8"]
heian-9x9 = ["heian", "haitaka/heian-9x9"]

extended-json = ["haitaka/extended-rules"]
shoshogi = ["extended-json", "haitaka/shoshogi"]
chushogi = ["extended-json", "haitaka/chushogi"]

torishogi = ["extended-json", "haitaka/torishogi"]

washogi = ["extended-json", "haitaka/washogi"]

heian-dai = ["extended-json", "haitaka/heian-dai"]

daishogi = ["extended-json", "haitaka/daishogi"]

tenjiku-dai = ["extended-json", "haitaka/tenjiku-dai"]

dai-dai = ["extended-json", "haitaka/dai-dai"]

maka-dai-dai = ["extended-json", "haitaka/maka-dai-dai"]

taishogi = ["extended-json", "haitaka/taishogi"]

taikyoku = ["extended-json", "haitaka/taikyoku"]
