[package]
name = "haitaka_wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haitaka = { path = "../haitaka", default-features = false }
wasm-bindgen = "0.2.100"
js-sys = "0.3.90"
instant = { version = "0.1", features = ["wasm-bindgen"] }

[dev-dependencies]
criterion = { version = "0.3.5", features = ["html_reports"] }
rand = "0.9"

[[bench]]
name = "nnue"
harness = false

[features]
donor-category = ["haitaka/donor-category"]
win-condition-category = ["haitaka/win-condition-category"]
king-constraint-category = ["haitaka/king-constraint-category"]
annan = ["donor-category", "haitaka/annan"]
anhoku = ["donor-category", "haitaka/anhoku"]
antouzai = ["donor-category", "haitaka/antouzai"]
taimen = ["donor-category", "haitaka/taimen"]
haimen = ["donor-category", "haitaka/haimen"]
neko = ["donor-category", "haitaka/neko"]
nekoneko = ["donor-category", "haitaka/nekoneko"]
yokoneko = ["donor-category", "haitaka/yokoneko"]
yokonekoneko = ["donor-category", "haitaka/yokonekoneko"]
tenkyo = ["donor-category", "haitaka/tenkyo"]
tenjiku = ["donor-category", "haitaka/tenjiku"]
anki = ["donor-category", "haitaka/anki"]
oute = ["win-condition-category", "haitaka/oute"]
sanmaime = ["win-condition-category", "haitaka/sanmaime"]
inochinotokin = ["win-condition-category", "haitaka/inochinotokin"]
igyoku = ["king-constraint-category", "haitaka/igyoku"]
hitomasuou = ["king-constraint-category", "haitaka/hitomasuou"]
