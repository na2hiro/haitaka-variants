[program:phase11b-seed80-extension]
command=/opt/supervisor-scripts/phase11b-seed80-extension.sh
directory=/workspace/haitaka-variants
environment=PATH="/root/.cargo/bin:%(ENV_PATH)s",HAITAKA_REPO_ROOT="/workspace/haitaka-variants"
autostart=false
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
